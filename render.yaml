# Render Blueprint — APEX API
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: apex-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: BIKE_DATA_PROVIDER
        value: api-ninjas
      - key: API_NINJAS_API_KEY
        sync: false
      - key: API_NINJAS_API_BASE_URL
        value: https://api.api-ninjas.com
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 30d
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: none
