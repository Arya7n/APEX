services:
  # Local dependencies for APEX API cache + optional Mongo
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - apex_mongo:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  apex_mongo:
